<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Extraction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            text-align: center;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
        }
        .result-item {
            margin-bottom: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resume Extraction</h1>
        <form id="uploadForm">
            <label for="file">Upload Resume (PDF):</label><br>
            <input type="file" id="file" name="file" accept=".pdf" required><br><br>
            <button type="submit">Extract</button>
        </form>
        <div id="output">
            <h3>Extracted Information:</h3>
            <div id="result">
                <p>No data yet...</p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("uploadForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async (e) => {
            e.preventDefault(); // Prevent default form submission

            // Hardcoded output for demonstration
            const name = "John Doe";
            const email = "john.doe@example.com";
            const phone = "123456789";

            // Display the fixed output
            result.innerHTML = `
                <div class="result-item"><strong>Name:</strong> ${name}</div>
                <div class="result-item"><strong>Email:</strong> ${email}</div>
                <div class="result-item"><strong>Phone:</strong> ${phone}</div>
            `;
        });
    </script>
</body>
</html>
